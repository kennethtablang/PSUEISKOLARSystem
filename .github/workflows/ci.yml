name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: psueiskolarsystem.client/package-lock.json
      - name: Install & build
        working-directory: psueiskolarsystem.client
        run: |
          npm ci
          npm run build

  build-test-server:
    name: Build & test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test PSUEISKOLARSystem.Server.Tests/PSUEISKOLARSystem.Server.Tests.csproj --no-build -c Release --verbosity normal
